# =============================================================================
# SSIMS PostgreSQL host-based access control
# TCP connections are accepted ONLY through TLS and ONLY with SCRAM-SHA-256.
# The unix socket is available only inside the database container (used by the
# entrypoint, backup jobs and healthchecks). PostgreSQL is never published.
# =============================================================================

local   all             all                                     trust
hostssl all             all             0.0.0.0/0               scram-sha-256
hostssl all             all             ::/0                    scram-sha-256
hostnossl all           all             all                     reject
