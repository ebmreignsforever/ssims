# =============================================================================
# SSIMS public edge reverse proxy
# - HTTP :8080 redirects to HTTPS (host port 80 -> container 8080)
# - HTTPS :8443 terminates TLS (host port 443 -> container 8443)
# - Only Nginx publishes ports; the API, frontend and database are internal.
# =============================================================================

limit_req_zone $binary_remote_addr zone=ssims_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ssims_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=ssims_webhook:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ssims_conn:10m;

upstream ssims_backend {
    server backend:4000;
    keepalive 32;
}

upstream ssims_frontend {
    server frontend:8080;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # Redirect all clear-text traffic to HTTPS. No content is served over HTTP.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is deliberately long-lived: this is an HTTPS-only demo deployment.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 20s;
    keepalive_timeout 30s;

    limit_conn ssims_conn 40;
    limit_req_status 429;
    limit_conn_status 429;

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"success":false,"error":{"code":"RATE_LIMITED","message":"Too many requests at the network edge"}}';
    }

    # Edge health endpoint, used by the container healthcheck.
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"ssims-edge"}';
    }

    # -------------------------------------------------------------------------
    # API
    # -------------------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=ssims_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://ssims_backend;
        include /etc/nginx/proxy_params_ssims.conf;
    }

    location ~ ^/api/auth/(register|forgot-password|reset-password)$ {
        limit_req zone=ssims_auth burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://ssims_backend;
        include /etc/nginx/proxy_params_ssims.conf;
    }

    location = /api/webhooks/security {
        limit_req zone=ssims_webhook burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://ssims_backend;
        include /etc/nginx/proxy_params_ssims.conf;
    }

    location /api/ {
        limit_req zone=ssims_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://ssims_backend;
        include /etc/nginx/proxy_params_ssims.conf;
        proxy_read_timeout 35s;
    }

    # Block attempts to access dotfiles or source maps directly.
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # -------------------------------------------------------------------------
    # Static SPA
    # -------------------------------------------------------------------------
    location /assets/ {
        proxy_pass http://ssims_frontend;
        include /etc/nginx/proxy_params_ssims.conf;
        expires 1y;
    }

    location / {
        proxy_pass http://ssims_frontend;
        include /etc/nginx/proxy_params_ssims.conf;
        expires -1;
    }

    # Deny methods not used by the SPA outside the API paths.
    if ($request_method !~ ^(GET|HEAD|POST|PATCH|PUT|DELETE|OPTIONS)$) {
        return 405;
    }
}
